<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<meta name="color-scheme" content="dark" />
		<title>Console</title>
		<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />

		<link rel="stylesheet" href="css/webstation.css" />
		<link rel="stylesheet" href="css/select.css" />
		<link rel="stylesheet" href="js/vendor/xterm-6.0.0.css" />
		<link rel="stylesheet" href="css/prompt-chat.css" />
		<link rel="stylesheet" href="css/console.css" />
		<script defer src="js/vfs.js" data-vfs-workspace></script>
		<script defer src="js/vendor/xterm-6.0.0.js"></script>
		<script defer src="js/vendor/xterm-addon-fit-0.11.0.js"></script>
		<script defer src="js/vendor/xterm-readline-2.0.0.js"></script>
		<script defer src="js/vendor/just-bash-3.6.1.browser.js"></script>
		<script defer src="js/just-bash-vfs.js"></script>
		<script defer src="js/console-history.js"></script>
		<script defer src="js/workspace-runner.js"></script>
		<script defer src="js/python-runner.js"></script>
		<script defer src="js/workspace-config-store.js"></script>
		<script defer src="js/llm-client.js"></script>
		<script defer src="js/llm.js"></script>
		<script defer src="js/transformer-model-assets.js"></script>
		<script defer src="js/llm-local.js"></script>
		<script defer src="js/vendor/markdown-it-15.0.3.min.js"></script>
		<script defer src="js/console-chat.js"></script>
		<script defer src="js/console.js"></script>
		<script defer src="js/select-picker.js"></script>
		<script defer src="js/navigation-frame.js"></script>
	</head>
	<body id="console-page">
		<iframe id="site-menu" title="Pages" src="navigation.html#console"></iframe>
		<main id="console">
			<header>
				<h1>Console</h1>
				<span id="console-cwd" aria-label="Working directory">/</span>
				<button id="console-chat-toggle" class="prompt-chat-toggle" type="button" aria-controls="console-chat"
					aria-expanded="false" aria-keyshortcuts="Control+I Meta+I" title="Console chat (Ctrl+I / Command+I)" disabled>
					<span aria-hidden="true">✦</span> Chat
				</button>
				<button id="console-interrupt" type="button" hidden>Interrupt</button>
				<button id="console-clear-history" type="button" title="Clear saved commands and output and restart the console">clear history</button>
			</header>
			<section id="console-shell" aria-label="Bash terminal">
				<p id="console-status" role="status"><span id="console-status-message" data-vfs-open-status>Opening workspace…</span>
					<button id="console-reload" type="button" hidden>Reload console</button></p>
				<div id="console-output"></div>
			</section>
			<form id="console-chat" class="prompt-chat" aria-label="Console chat" hidden>
				<label for="console-chat-prompt"><span aria-hidden="true">✦</span> Console chat</label>
				<button class="prompt-chat-close" type="button" aria-label="Close console chat" title="Close (Esc)">×</button>
				<textarea id="console-chat-prompt" class="prompt-chat-input" rows="2" required placeholder="Describe what you want to do in Bash…"></textarea>
				<div class="prompt-chat-actions">
					<span class="prompt-chat-status" role="status"></span>
					<button class="prompt-chat-send" type="submit" disabled>Send <span aria-hidden="true">↑</span></button>
				</div>
			</form>
			<p id="console-history-status" role="status" hidden></p>
			<p id="console-keys"><kbd>Tab</kbd> Complete path <span>·</span> <kbd>↑</kbd> <kbd>↓</kbd> History <span>·</span> <kbd>Ctrl+C</kbd> Interrupt <span>·</span> <kbd>Shift+Enter</kbd> New line</p>
		</main>
		<dialog id="console-chat-result" class="prompt-chat-result" aria-labelledby="console-chat-result-title">
			<h2 id="console-chat-result-title">Console chat</h2>
			<div class="prompt-chat-output"></div>
			<p id="console-chat-inserted" hidden>Last code block inserted at the Bash cursor. Press Enter in the terminal to run it.</p>
			<form method="dialog"><button autofocus>Continue to console</button></form>
		</dialog>
	</body>
</html>
