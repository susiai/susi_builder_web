	</head>
	<body id="console-page">
		<iframe id="site-menu" title="Pages" src="navigation.html#console"></iframe>
		<main id="console">
			<header>
				<h1>Console</h1>
				<span id="console-cwd" aria-label="Working directory">/</span>
				<button id="console-interrupt" type="button" hidden>Interrupt</button>
				<button id="console-clear-history" type="button" title="Clear saved commands and output and restart the console">clear history</button>
			</header>
			<section id="console-shell" aria-label="Bash terminal">
				<p id="console-status" role="status"><span id="console-status-message" data-vfs-open-status>Opening workspace…</span>
					<button id="console-reload" type="button" hidden>Reload console</button></p>
				<div id="console-output"></div>
			</section>
			<p id="console-history-status" role="status" hidden></p>
			<p id="console-keys"><kbd>Tab</kbd> Complete path <span>·</span> <kbd>↑</kbd> <kbd>↓</kbd> History <span>·</span> <kbd>Ctrl+C</kbd> Interrupt <span>·</span> <kbd>Shift+Enter</kbd> New line</p>
		</main>
	</body>
</html>
