<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<meta name="color-scheme" content="dark" />
		<title>Code Studio</title>
		<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any" />

		<link rel="stylesheet" href="css/webstation.css" />
		<link rel="stylesheet" href="css/select.css" />
		<link rel="stylesheet" href="css/vfs-editor.css" />
		<link rel="stylesheet" href="css/prompt-chat.css" />
		<link rel="stylesheet" href="css/code-studio.css" />
		<link rel="stylesheet" href="css/speech-dictation.css" />
		<script defer src="js/vfs.js" data-vfs-workspace></script>
		<script defer src="js/vfs-browser.js"></script>
		<script defer src="js/vendor/ace-1.45.2/ace.js"></script>
		<script defer src="js/vendor/ace-1.45.2/ext-modelist.js"></script>
		<script defer src="js/vfs-editor.js"></script>
		<script defer src="js/workspace-config-store.js"></script>
		<script defer src="js/studio-state.js"></script>
		<script defer src="js/page-settings.js"></script>
		<script defer src="js/transformer-model-assets.js"></script>
		<script defer src="js/stt.js"></script>
		<script defer src="js/llm-client.js"></script>
		<script defer src="js/llm.js"></script>
		<script defer src="js/llm-local.js"></script>
		<script defer src="js/tool-registry.js"></script>
		<script defer src="js/workstation-tools.js"></script>
		<script defer src="js/agent-runtime.js"></script>
		<script defer src="js/agent-settings.js"></script>
		<script defer src="js/vendor/diff-8.0.4.min.js"></script>
		<script defer src="js/studio-file-chat.js"></script>
		<script defer src="js/code-studio.js"></script>
		<script defer src="js/select-picker.js"></script>
		<script defer src="js/navigation-frame.js"></script>
	</head>
	<body id="studio-page">
		<iframe id="site-menu" title="Pages" src="navigation.html#code-studio"></iframe>
		<main id="code-studio" aria-labelledby="studio-title" data-explorer-open="true">
			<aside id="studio-explorer" aria-label="Explorer">
				<header>
					<h1 id="studio-title">Code Studio</h1>
				</header>
				<div id="studio-tree-scroll" role="region" aria-label="VFS files and folders" tabindex="0" aria-haspopup="menu">
					<p id="studio-tree-empty">Loading files…</p>
					<ul id="studio-tree" aria-label="VFS files"></ul>
				</div>
			</aside>
			<div id="studio-workbench">
				<header id="studio-tabbar">
					<button id="studio-toggle" type="button" aria-expanded="true" aria-controls="studio-explorer">Explorer</button>
					<div id="studio-tabs" role="tablist" aria-label="Open files"></div>
					<div id="studio-save-group" hidden>
						<span id="studio-save-status" role="status"></span>
						<button type="button" id="studio-save" aria-label="Save file" title="Save (Ctrl+S / Command+S)" aria-keyshortcuts="Control+S Meta+S">
							<img src="icons/action-document-save.svg" alt="" />
						</button>
						<button type="button" id="studio-chat-toggle" class="prompt-chat-toggle" aria-controls="studio-chat" aria-expanded="false"
							aria-keyshortcuts="Control+I Meta+I" title="File chat (Ctrl+I / Command+I)" disabled>
							<span aria-hidden="true">✦</span> Chat
						</button>
					</div>
					<div id="studio-dictation-controls" hidden>
						<button id="studio-record" type="button" aria-label="Record audio"
							title="Record audio in the active editor" hidden disabled>
							<img src="icons/device-audio-input-microphone.svg" alt="" />
						</button>
						<button id="studio-stop-recording" type="button" aria-label="Stop recording" title="Stop recording and transcribe" hidden>
							<span aria-hidden="true"></span>
						</button>
					</div>
				</header>
				<div id="studio-panel" role="tabpanel" hidden>
					<header>
						<div id="studio-filebar">
							<span id="studio-path"></span>
							<button type="button" id="studio-chat-undo" title="Restore the file to its state before the last AI edit" hidden>
								<img src="icons/action-edit-undo.svg" alt="" /> Undo AI edit
							</button>
							<span id="studio-language"></span>
						</div>
						<div id="studio-microphone" class="dictation-microphone" hidden>
							<label hidden>Microphone level <meter min="-60" max="0" value="-60"></meter></label>
							<button type="button" hidden>Release microphone</button>
						</div>
						<div id="studio-dictation-feedback" hidden>
							<p id="studio-dictation-status" role="status"></p>
							<div id="studio-dictation-progress" hidden>
								<progress aria-label="Audio transcription progress"></progress>
								<button id="studio-dictation-cancel" type="button">Cancel</button>
							</div>
						</div>
					</header>
					<div id="studio-editor"></div>
					<div id="studio-image-preview" role="region" aria-label="Image preview" tabindex="-1" hidden>
						<img class="vfs-image-preview" alt="" />
					</div>
					<form id="studio-chat" class="prompt-chat" aria-label="File chat" hidden>
						<label for="studio-chat-prompt"><span aria-hidden="true">✦</span> File chat
							<small id="studio-chat-selection" hidden>Selection included</small>
						</label>
						<button type="button" id="studio-chat-close" class="prompt-chat-close" aria-label="Close file chat" title="Close (Esc)">×</button>
						<textarea id="studio-chat-prompt" class="prompt-chat-input" rows="2" required placeholder="Describe a change to this file…"></textarea>
						<div id="studio-chat-actions" class="prompt-chat-actions">
							<span id="studio-chat-status" class="prompt-chat-status" role="status"></span>
							<button type="submit" id="studio-chat-submit" class="prompt-chat-send" disabled>Send <span aria-hidden="true">↑</span></button>
						</div>
					</form>
				</div>
				<div id="studio-empty">
					<img src="icons/mime-text-x-generic.svg" alt="" />
					<p>Open a file from the Explorer.</p>
				</div>
				<p id="studio-message" data-vfs-open-status role="status" hidden></p>
			</div>
		</main>
		<dialog id="studio-chat-result" class="prompt-chat-result" aria-labelledby="studio-chat-result-title">
			<h2 id="studio-chat-result-title">File chat</h2>
			<p id="studio-chat-result-path"></p>
			<div id="studio-chat-output" class="prompt-chat-output"></div>
			<form method="dialog"><button autofocus>Continue to editor</button></form>
		</dialog>
		<div id="studio-context" role="menu" aria-label="File actions" hidden>
			<button type="button" role="menuitem" data-command="new-file" hidden>
				<img src="icons/mime-text-x-generic.svg" alt="" /> New file
			</button>
			<button type="button" role="menuitem" data-command="new-folder" hidden>
				<img src="icons/action-folder-new.svg" alt="" /> New folder
			</button>
			<button type="button" role="menuitem" data-command="open-table" title="Open the saved file in Table editor" hidden>
				<img src="icons/mime-x-office-spreadsheet.svg" alt="" /> Open in Table editor
			</button>
			<button type="button" role="menuitem" data-command="download">
				<img src="icons/action-document-save-as.svg" alt="" /> Download
			</button>
			<button type="button" role="menuitem" data-command="rename">
				<img src="icons/application-accessories-text-editor.svg" alt="" /> Rename
			</button>
			<button type="button" role="menuitem" data-command="delete">
				<img src="icons/action-edit-delete.svg" alt="" /> Delete
			</button>
		</div>
	</body>
</html>
