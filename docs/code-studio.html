<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<meta name="color-scheme" content="dark" />
		<title>Code Studio</title>
		<link rel="icon" href="favicon.ico?v=0db13523" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="favicon.svg?v=e7e3673c" type="image/svg+xml" sizes="any" />

		<link rel="stylesheet" href="css/webstation.css?v=ad0ea45f" />
		<link rel="stylesheet" href="css/vfs-editor.css?v=01011d71" />
		<link rel="stylesheet" href="css/code-studio.css?v=e7db2a33" />
		<link rel="stylesheet" href="css/speech-dictation.css?v=92b87b4e" />
		<script defer src="js/vfs.js?v=6a2f831b"></script>
		<script defer src="js/vfs-browser.js?v=f36d53fe"></script>
		<script defer src="js/vendor/ace-1.45.2/ace.js?v=e1e8dc2a"></script>
		<script defer src="js/vendor/ace-1.45.2/ext-modelist.js?v=9a44627d"></script>
		<script defer src="js/vfs-editor.js?v=f56293f0"></script>
		<script defer src="js/studio-state.js?v=c8cb9863"></script>
		<script defer src="js/page-settings.js?v=60de7c53"></script>
		<script defer src="js/transformer-model-assets.js?v=9de616b6"></script>
		<script defer src="js/stt.js?v=91cb9caf"></script>
		<script defer src="js/code-studio.js?v=7673330c"></script>
		<script defer src="js/navigation-frame.js?v=6f2455e6"></script>
	</head>
	<body id="studio-page">
		<iframe id="site-menu" title="Pages" src="navigation.html#code-studio"></iframe>
		<main id="code-studio" aria-labelledby="studio-title" data-explorer-open="true">
			<aside id="studio-explorer" aria-label="Explorer">
				<header>
					<h1 id="studio-title">Code Studio</h1>
				</header>
				<div id="studio-tree-scroll" role="region" aria-label="VFS files and folders" tabindex="0" aria-haspopup="menu">
					<p id="studio-tree-empty">Loading files…</p>
					<ul id="studio-tree" aria-label="VFS files"></ul>
				</div>
			</aside>
			<div id="studio-workbench">
				<header id="studio-tabbar">
					<button id="studio-toggle" type="button" aria-expanded="true" aria-controls="studio-explorer">Explorer</button>
					<div id="studio-tabs" role="tablist" aria-label="Open files"></div>
					<div id="studio-save-group" hidden>
						<span id="studio-save-status" role="status"></span>
						<button type="button" id="studio-save" aria-label="Save file" title="Save (Ctrl+S / Command+S)" aria-keyshortcuts="Control+S Meta+S">
							<img src="icons/action-document-save.svg" alt="" />
						</button>
					</div>
					<div id="studio-dictation-controls" hidden>
						<button id="studio-record" type="button" aria-label="Record audio"
							title="Record audio in the active editor" hidden disabled>
							<img src="icons/device-audio-input-microphone.svg" alt="" />
						</button>
						<button id="studio-stop-recording" type="button" aria-label="Stop recording" title="Stop recording and transcribe" hidden>
							<span aria-hidden="true"></span>
						</button>
					</div>
				</header>
				<div id="studio-panel" role="tabpanel" hidden>
					<header>
						<div id="studio-filebar">
							<span id="studio-path"></span>
							<span id="studio-language"></span>
						</div>
						<div id="studio-microphone" class="dictation-microphone" hidden>
							<label hidden>Microphone level <meter min="-60" max="0" value="-60"></meter></label>
							<button type="button" hidden>Release microphone</button>
						</div>
						<div id="studio-dictation-feedback" hidden>
							<p id="studio-dictation-status" role="status"></p>
							<div id="studio-dictation-progress" hidden>
								<progress aria-label="Audio transcription progress"></progress>
								<button id="studio-dictation-cancel" type="button">Cancel</button>
							</div>
						</div>
					</header>
					<div id="studio-editor"></div>
				</div>
				<div id="studio-empty">
					<img src="icons/mime-text-x-generic.svg" alt="" />
					<p>Open a file from the Explorer.</p>
				</div>
				<p id="studio-message" data-vfs-open-status role="status" hidden></p>
			</div>
		</main>
		<div id="studio-context" role="menu" aria-label="File actions" hidden>
			<button type="button" role="menuitem" data-command="new-file" hidden>
				<img src="icons/mime-text-x-generic.svg" alt="" /> New file
			</button>
			<button type="button" role="menuitem" data-command="new-folder" hidden>
				<img src="icons/action-folder-new.svg" alt="" /> New folder
			</button>
			<button type="button" role="menuitem" data-command="open-table" title="Open the saved file in Table" hidden>
				<img src="icons/mime-x-office-spreadsheet.svg" alt="" /> Open in Table
			</button>
			<button type="button" role="menuitem" data-command="download">
				<img src="icons/action-document-save-as.svg" alt="" /> Download
			</button>
			<button type="button" role="menuitem" data-command="rename">
				<img src="icons/application-accessories-text-editor.svg" alt="" /> Rename
			</button>
			<button type="button" role="menuitem" data-command="delete">
				<img src="icons/action-edit-delete.svg" alt="" /> Delete
			</button>
		</div>
	</body>
</html>
