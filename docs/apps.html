<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>SUSI Builder Apps</title>
		<link rel="icon" href="favicon.ico?v=0db13523" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="favicon.svg?v=e7e3673c" type="image/svg+xml" sizes="any" />
		<link rel="stylesheet" href="css/webstation.css?v=ad0ea45f" />
		<link rel="stylesheet" href="css/projects.css?v=51bf8789" />
		<script defer src="js/vfs.js?v=042c0bb7"></script>
		<script defer src="js/vfs-projects.js?v=51f57010"></script>
		<script defer src="js/vfs-browser.js?v=f36d53fe"></script>
		<script defer src="js/vendor/zip-2.25.0.min.js?v=49bb1d59"></script>
		<script defer src="js/vfs-zip.js?v=5a1453de"></script>
		<script defer src="js/projects.js?v=7e2d5a3d"></script>
		<script defer src="js/navigation-frame.js?v=6f2455e6"></script>
	</head>
	<body id="projects-page">
		<iframe id="site-menu" title="Pages" src="navigation.html#apps"></iframe>
		<header>
			<h1>Apps</h1>
			<p>Create an app, open it in Chat or Code Studio, or use its star to pin it to Home.</p>
		</header>
		<main id="layout">
			<p id="project-status" data-vfs-open-status role="status" hidden></p>
			<p id="project-loading" role="status">Loading apps…</p>
			<ul id="project-list" aria-label="Apps" aria-busy="true">
				<li id="project-new-tile"><button id="project-new" type="button" disabled>New App</button></li>
			</ul>
		</main>
		<dialog id="project-dialog" aria-labelledby="project-dialog-title">
			<h2 id="project-dialog-title">New app</h2>
			<p><a href="create_app.html">Start from a template</a></p>
			<form id="project-form">
				<label for="project-name">App name</label>
				<input id="project-name" required maxlength="120" autocomplete="off" autofocus />
				<p id="project-error" role="alert" hidden></p>
				<div>
					<button id="project-cancel" type="button">Cancel</button>
					<button id="project-create" type="submit">Create app</button>
				</div>
			</form>
		</dialog>
		<dialog id="app-delete-dialog" aria-labelledby="app-delete-title" aria-describedby="app-delete-description">
			<h2 id="app-delete-title">Delete app?</h2>
			<p id="app-delete-description">This permanently deletes the app and all files in <strong id="app-delete-path"></strong>.</p>
			<form id="app-delete-form">
				<p id="app-delete-error" role="alert" hidden></p>
				<div>
					<button id="app-delete-cancel" type="button" autofocus>Cancel</button>
					<button id="app-delete-confirm" type="submit">Delete app</button>
				</div>
			</form>
		</dialog>
	</body>
</html>
